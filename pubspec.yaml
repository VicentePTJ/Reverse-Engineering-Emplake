name: emplake_game
description: "Engenharia Reversa do Jogo Emplake em Flutter com Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  shared_preferences: ^2.2.3
  curved_navigation_bar: ^1.0.3
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.2.0
  flutter_spinkit: ^5.2.1
  audioplayers: ^6.1.0
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_ui_auth: ^3.1.1
  firebase_ui_oauth_google: ^2.1.1
  firebase_ui_localizations: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/